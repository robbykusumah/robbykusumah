name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"   # optional: run daily at 00:00 UTC
  workflow_dispatch:      # allow manual run from Actions UI
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true   # make sure GITHUB_TOKEN can push

      - name: Generate snake SVG
        uses: Platane/snk@v3
        with:
          github_user_name: robbykusumah
          outputs: dist/github-contribution-grid-snake.svg
          # outputs_path: dist   # optional

      - name: Prepare output branch and move SVG to root
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          # create or reset output branch
          git fetch origin
          git checkout -B output
          # ensure dist file exists
          if [ -f dist/github-contribution-grid-snake.svg ]; then
            mv dist/github-contribution-grid-snake.svg ./github-contribution-grid-snake.svg
            git add github-contribution-grid-snake.svg
            git commit -m "chore: update snake contribution graph" || echo "No changes to commit"
            git push origin output --force
          else
            echo "ERROR: dist/github-contribution-grid-snake.svg not found"
            exit 1
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
