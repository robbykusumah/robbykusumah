name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"   # generate daily
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate snake SVG
        uses: platane/snk@v3
        with:
          github_user_name: robbykusumah
          outputs: dist/github-contribution-grid-snake.svg

      - name: Push to output branch
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git checkout -b output || git checkout output
          git add dist/*
          git commit -m "chore: update snake contribution graph" || echo "No changes to commit"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} output --force
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
